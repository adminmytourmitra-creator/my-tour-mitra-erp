<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="My Tour Mitra Travel Agency ERP"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>My Tour Mitra ERP</title>


    <!-- =====================================================
         GLOBAL STYLES
         ===================================================== -->

    <link
        rel="stylesheet"
        href="./CSS/global.css"
    >

    <!-- =====================================================
         LOGIN STYLES
         ===================================================== -->

    <link
        rel="stylesheet"
        href="./CSS/login.css"
    >

    <!-- =====================================================
         APPLICATION STYLES
         ===================================================== -->

    <link
        rel="stylesheet"
        href="./CSS/app.css"
    >

    <!-- =====================================================
         DASHBOARD STYLES
         ===================================================== -->

    <link
        rel="stylesheet"
        href="./CSS/dashboard.css"
    >

</head>


<body>

    <!-- =====================================================
         APPLICATION ROOT
         ===================================================== -->

    <div id="app">


        <!-- =================================================
             LOGIN SCREEN
             ================================================= -->

        <section
            id="screen-login"
            class="screen screen-login"
            aria-label="Login"
        >

            <div class="login-container">

                <div class="login-card">


                    <!-- =====================================
                         BRAND
                         ===================================== -->

                    <div class="login-brand">

                        <div
                            id="login-logo-wrapper"
                            class="login-logo-wrapper"
                        >

                            <img
                                id="login-logo"
                                class="login-logo hidden"
                                src=""
                                alt="My Tour Mitra"
                            >

                            <div
                                id="login-logo-placeholder"
                                class="login-logo-placeholder"
                            >
                                MTM
                            </div>

                        </div>


                        <h1 id="login-company-name">
                            My Tour Mitra
                        </h1>

                        <p>
                            Travel Agency ERP
                        </p>

                    </div>


                    <!-- =====================================
                         LOGIN FORM
                         ===================================== -->

                    <form
                        id="login-form"
                        class="login-form"
                        autocomplete="on"
                    >


                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="login-email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="login-email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="form-group">

                            <label for="login-password">
                                Password
                            </label>

                            <div class="password-input-wrapper">

                                <input
                                    type="password"
                                    id="login-password"
                                    name="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    type="button"
                                    id="toggle-password"
                                    class="password-toggle"
                                    aria-label="Show password"
                                >
                                    Show
                                </button>

                            </div>

                        </div>


                        <!-- ERROR -->

                        <div
                            id="login-error"
                            class="form-message form-error hidden"
                            role="alert"
                        ></div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            id="login-button"
                            class="btn btn-primary btn-full"
                        >

                            <span id="login-button-text">
                                Login
                            </span>

                            <span
                                id="login-button-loader"
                                class="button-loader hidden"
                                aria-hidden="true"
                            ></span>

                        </button>


                    </form>


                    <!-- =====================================
                         LOGIN FOOTER
                         ===================================== -->

                    <div class="login-footer">

                        <span>
                            My Tour Mitra
                        </span>

                        <span>
                            •
                        </span>

                        <span>
                            Travel Agency ERP
                        </span>

                    </div>


                </div>

            </div>

        </section>


        <!-- =================================================
             MAIN APPLICATION
             ================================================= -->

        <section
            id="screen-app"
            class="screen screen-app hidden"
            aria-label="ERP Application"
        >


            <!-- =============================================
                 SIDEBAR
                 ============================================= -->

            <aside
                id="sidebar"
                class="sidebar"
                aria-label="Main Navigation"
            >


                <!-- SIDEBAR HEADER -->

                <div class="sidebar-header">

                    <div class="sidebar-brand">

                        <div
                            id="sidebar-logo-wrapper"
                            class="sidebar-logo-wrapper"
                        >

                            <img
                                id="sidebar-logo"
                                class="sidebar-logo hidden"
                                src=""
                                alt="My Tour Mitra"
                            >

                            <div
                                id="sidebar-logo-placeholder"
                                class="sidebar-logo-placeholder"
                            >
                                MTM
                            </div>

                        </div>


                        <div class="sidebar-brand-text">

                            <strong id="sidebar-company-name">
                                My Tour Mitra
                            </strong>

                            <span>
                                ERP
                            </span>

                        </div>

                    </div>


                    <button
                        type="button"
                        id="sidebar-close"
                        class="sidebar-close"
                        aria-label="Close navigation"
                    >
                        ×
                    </button>

                </div>


                <!-- =========================================
                     NAVIGATION
                     ========================================= -->

                <nav
                    id="main-navigation"
                    class="main-navigation"
                    aria-label="ERP Modules"
                >


                    <button
                        type="button"
                        class="nav-item active"
                        data-module="dashboard"
                        data-title="Dashboard"
                    >
                        <span class="nav-icon">⌂</span>
                        <span class="nav-label">Dashboard</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="customers"
                        data-title="Customers"
                    >
                        <span class="nav-icon">◉</span>
                        <span class="nav-label">Customers</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="enquiries"
                        data-title="Enquiries"
                    >
                        <span class="nav-icon">?</span>
                        <span class="nav-label">Enquiries</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="followups"
                        data-title="Follow-ups"
                    >
                        <span class="nav-icon">◷</span>
                        <span class="nav-label">Follow-ups</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="packages"
                        data-title="Packages"
                    >
                        <span class="nav-icon">▣</span>
                        <span class="nav-label">Packages</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="quotations"
                        data-title="Quotations"
                    >
                        <span class="nav-icon">▤</span>
                        <span class="nav-label">Quotations</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="bookings"
                        data-title="Bookings"
                    >
                        <span class="nav-icon">✓</span>
                        <span class="nav-label">Bookings</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="invoices"
                        data-title="Invoices"
                    >
                        <span class="nav-icon">₹</span>
                        <span class="nav-label">Invoices</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="payments"
                        data-title="Payments"
                    >
                        <span class="nav-icon">₹</span>
                        <span class="nav-label">Payments</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="expenses"
                        data-title="Expenses"
                    >
                        <span class="nav-icon">−</span>
                        <span class="nav-label">Expenses</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="profit-loss"
                        data-title="Profit & Loss"
                    >
                        <span class="nav-icon">↗</span>
                        <span class="nav-label">Profit & Loss</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="vouchers"
                        data-title="Vouchers"
                    >
                        <span class="nav-icon">▧</span>
                        <span class="nav-label">Vouchers</span>
                    </button>


                    <div class="nav-divider"></div>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="team"
                        data-title="Team / Users"
                    >
                        <span class="nav-icon">♙</span>
                        <span class="nav-label">Team / Users</span>
                    </button>


                    <button
                        type="button"
                        class="nav-item"
                        data-module="settings"
                        data-title="Settings"
                    >
                        <span class="nav-icon">⚙</span>
                        <span class="nav-label">Settings</span>
                    </button>


                </nav>


                <!-- =========================================
                     SIDEBAR USER
                     ========================================= -->

                <div class="sidebar-user">

                    <div class="user-avatar">
                        <span id="sidebar-user-initial">
                            A
                        </span>
                    </div>


                    <div class="sidebar-user-info">

                        <strong id="sidebar-user-name">
                            Admin
                        </strong>

                        <span id="sidebar-user-role">
                            Administrator
                        </span>

                    </div>


                    <button
                        type="button"
                        id="sidebar-logout"
                        class="logout-button"
                        title="Logout"
                        aria-label="Logout"
                    >
                        ↪
                    </button>

                </div>


            </aside>


            <!-- =============================================
                 APPLICATION LAYOUT
                 ============================================= -->

            <div
                id="app-layout"
                class="app-layout"
            >


                <!-- TOPBAR -->

                <header
                    id="topbar"
                    class="topbar"
                >

                    <div class="topbar-left">

                        <button
                            type="button"
                            id="sidebar-toggle"
                            class="sidebar-toggle"
                            aria-label="Open navigation"
                        >
                            ☰
                        </button>


                        <div class="page-heading">

                            <h1 id="page-title">
                                Dashboard
                            </h1>

                            <p id="page-subtitle">
                                Travel agency overview
                            </p>

                        </div>

                    </div>


                    <div class="topbar-right">


                        <button
                            type="button"
                            id="notification-button"
                            class="topbar-action"
                            aria-label="Notifications"
                        >

                            <span class="topbar-action-icon">
                                ♢
                            </span>

                            <span
                                id="notification-count"
                                class="notification-badge hidden"
                            >
                                0
                            </span>

                        </button>


                        <div
                            id="topbar-user"
                            class="topbar-user"
                        >

                            <div class="topbar-user-avatar">

                                <span id="topbar-user-initial">
                                    A
                                </span>

                            </div>


                            <div class="topbar-user-info">

                                <strong id="topbar-user-name">
                                    Admin
                                </strong>

                                <span id="topbar-user-role">
                                    Administrator
                                </span>

                            </div>

                        </div>

                    </div>

                </header>


                <!-- MODULE CONTAINER -->

                <main
                    id="module-container"
                    class="module-container"
                >

                    <div
                        id="initial-loader"
                        class="initial-loader"
                    >

                        <div class="loader-spinner"></div>

                        <p>
                            Loading My Tour Mitra ERP...
                        </p>

                    </div>

                </main>


            </div>

        </section>


        <!-- =================================================
             GLOBAL MODAL
             ================================================= -->

        <div
            id="global-modal"
            class="modal-overlay hidden"
            role="dialog"
            aria-modal="true"
            aria-hidden="true"
        >

            <div
                id="global-modal-container"
                class="modal-container"
            >

                <div class="modal-header">

                    <h2 id="global-modal-title">
                        Modal
                    </h2>

                    <button
                        type="button"
                        id="global-modal-close"
                        class="modal-close"
                        aria-label="Close"
                    >
                        ×
                    </button>

                </div>


                <div
                    id="global-modal-body"
                    class="modal-body"
                ></div>


                <div
                    id="global-modal-footer"
                    class="modal-footer"
                ></div>

            </div>

        </div>


        <!-- =================================================
             GLOBAL TOAST
             ================================================= -->

        <div
            id="toast-container"
            class="toast-container"
            aria-live="polite"
            aria-atomic="true"
        ></div>


        <!-- =================================================
             CONFIRMATION DIALOG
             ================================================= -->

        <div
            id="confirm-dialog"
            class="modal-overlay hidden"
            role="alertdialog"
            aria-modal="true"
            aria-hidden="true"
        >

            <div class="confirm-dialog">

                <div class="confirm-icon">
                    !
                </div>

                <h2 id="confirm-title">
                    Confirm Action
                </h2>

                <p id="confirm-message">
                    Are you sure you want to continue?
                </p>

                <div class="confirm-actions">

                    <button
                        type="button"
                        id="confirm-cancel"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </button>

                    <button
                        type="button"
                        id="confirm-ok"
                        class="btn btn-danger"
                    >
                        Confirm
                    </button>

                </div>

            </div>

        </div>


    </div>


        <!-- =========================================================
         APPLICATION JAVASCRIPT
         ========================================================= -->

    <script src="./js/config.js"></script>

    <script src="./js/firebase.js"></script>

    <script src="./js/auth.js"></script>

    <script src="./js/ui.js"></script>

    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>
</html>
